# nginx in the frontend container: serves the built React app and forwards /api to the FastAPI
# backend, so the browser talks to one origin (http://localhost:5173) and no CORS is needed.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The backend accepts image files up to 10 MB. Leave room for the multipart framing so that
    # the backend, not nginx, rejects larger files with its JSON 413 message.
    client_max_body_size 12m;

    location /api/ {
        # Resolve "backend" through Docker's DNS at request time (not only at startup), so nginx
        # starts even before the backend and keeps working after the backend container is
        # recreated with a new IP address. With a variable, the full request URI (/api/...) is
        # passed on unchanged.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Only for errors nginx itself produces (backend down or starting); the backend's own
        # responses, including its 503 "model missing" messages, pass through unchanged.
        error_page 502 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        return 502 '{"detail": "The backend is not reachable. It may still be starting; try again in a few seconds."}';
    }

    # Build assets have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: workspace URLs such as /hard-routed-restoration load index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
